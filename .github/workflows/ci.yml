name: CI

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache: false
      - name: Check and build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test/results/local
          if ! { make test && make build && ./bin/tokening version; } 2>&1 | tee test/results/local/check.log; then
            echo "::error::Checks failed. Read the check log artifact for the full command output."
            exit 1
          fi
      - name: Show measured failure-test results
        shell: bash
        run: |
          # Annotations stay readable when log and artifact hosts are not.
          python3 - <<'PY'
          import json
          for line in open('test/results/local/tests.jsonl', encoding='utf-8'):
              text = json.loads(line).get('Output', '')
              for key in ('{"consumer_race":', '{"flight_recorder":'):
                  start = text.find(key)
                  if start >= 0:
                      print('::notice title=' + key[2:-2] + '::' + text[start:].strip())
          PY
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-log-${{ matrix.os }}
          path: test/results/local/

  demo:
    name: Docker WordPress demo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Run the disposable WordPress demo
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test/results/local/demo
          if ! python3 demo/run.py 2>&1 | tee test/results/local/demo/run.log; then
            echo "::error::Docker demo failed. Read the demo diagnostics artifact."
            exit 1
          fi
      - name: Preserve demo diagnostics and replay
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-wordpress-demo
          path: test/results/local/demo/

  panel:
    name: Panel browser checks
    needs: demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: docker-wordpress-demo
          path: test/results/local/demo/
      - name: Check the replay and live panel in Chrome
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test/results/local/panel
          if ! {
            npm install --prefix "$RUNNER_TEMP/tokening-browser" --no-audit --no-fund playwright@1.58.2
            go build -o bin/tokening ./cmd/tokening
            CHROME_PATH="$(command -v google-chrome)" NODE_PATH="$RUNNER_TEMP/tokening-browser/node_modules" node scripts/panel-browser-test.cjs
          } 2>&1 | tee test/results/local/panel/check.log; then
            echo "::error::Panel browser checks failed. Read the panel diagnostics artifact."
            # Repeat the last lines as annotations so the cause is readable without the artifact.
            # One annotation: GitHub keeps only the first few per step.
            echo "::error title=panel check log::$(grep -v '^go: downloading\|^\s*$' test/results/local/panel/check.log | tail -n 30 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
      - name: Preserve browser diagnostics and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panel-browser-checks
          path: test/results/local/panel/
