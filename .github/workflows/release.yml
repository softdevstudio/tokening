name: Release

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: "main for a new version, or an existing vX.Y.Z tag to rebuild"
        default: main
        type: string
      rebuild:
        description: "Rebuild an existing tag after fresh checks"
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: tokening-release
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.guard.outputs.release }}
      sha: ${{ steps.guard.outputs.sha }}
      version: ${{ steps.guard.outputs.version }}
    steps:
      - name: Validate the requested ref
        if: github.event_name == 'workflow_dispatch'
        env:
          REQUESTED_REF: ${{ inputs.ref }}
        run: '[[ "$REQUESTED_REF" =~ ^(main|v[0-9]+\.[0-9]+\.[0-9]+)$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref || 'main' }}
          fetch-depth: 0
      - name: Require reviewed source and an untagged version
        id: guard
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          REBUILD: ${{ inputs.rebuild || false }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py prepare

  manual-checks:
    needs: prepare
    if: github.event_name == 'workflow_dispatch' && needs.prepare.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  build:
    needs: [prepare, manual-checks]
    if: >-
      always() && needs.prepare.outputs.release == 'true' &&
      (needs.manual-checks.result == 'success' ||
       (github.event_name == 'workflow_run' && needs.manual-checks.result == 'skipped'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-latest, target: linux-amd64}
          - {runner: ubuntu-24.04-arm, target: linux-arm64}
          - {runner: macos-15-intel, target: darwin-amd64}
          - {runner: macos-15, target: darwin-arm64}
          - {runner: windows-latest, target: windows-amd64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      CGO_ENABLED: "0"
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Native tests, archive build and extracted-binary smoke
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -o pipefail
          mkdir -p "test/results/local/release-$RELEASE_TARGET"
          if ! python scripts/release.py build --target "$RELEASE_TARGET" 2>&1 | tee "test/results/local/release-$RELEASE_TARGET/build.log"; then
            echo "::error::Native release checks failed. Read the release diagnostics artifact."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
      - name: Preserve native diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-check-${{ matrix.target }}
          path: test/results/local/release-${{ matrix.target }}/

  publish:
    needs: [prepare, build]
    if: always() && !cancelled() && needs.prepare.result == 'success' && needs.build.result == 'success' && needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: docker-wordpress-demo
          path: evidence/demo/
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id || github.run_id }}
      - uses: actions/download-artifact@v4
        with:
          pattern: check-log-*
          path: evidence/tests/
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id || github.run_id }}
      - uses: actions/download-artifact@v4
        with:
          name: panel-browser-checks
          path: evidence/panel/
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id || github.run_id }}
      - name: Verify every result and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_EVENT: ${{ github.event_name }}
          EVIDENCE_RUN_ID: ${{ github.event.workflow_run.id || github.run_id }}
        run: python3 scripts/release.py publish
